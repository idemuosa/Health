version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=health_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mlflow:
    image: ghcr.io/mlflow/mlflow
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./artifacts

  backend:
    build: 
      context: .
      dockerfile: ./docker/backend.Dockerfile
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://admin:password@db:5432/health_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  ai_service:
    build:
      context: .
      dockerfile: ./docker/ai_service.Dockerfile
    volumes:
      - .:/app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    ports:
      - "8001:8001"

  worker:
    build:
      context: .
      dockerfile: ./docker/backend.Dockerfile
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://admin:password@db:5432/health_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A core_management worker --loglevel=info

volumes:
  postgres_data:
